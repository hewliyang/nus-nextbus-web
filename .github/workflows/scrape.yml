name: Weekly Scrape

on:
  schedule:
    - cron: '0 0 * * 1,4' # run on Mon and Thurs

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run scraping script
        env:
          # Required - configure these as repository secrets:
          #   Settings -> Secrets and variables -> Actions -> New repository secret
          # The script aborts if any required value is missing. See .env.example.
          NEXTBUS_BASE: ${{ secrets.NEXTBUS_BASE }}
          NEXTBUS_API_KEY: ${{ secrets.NEXTBUS_API_KEY }}
          NEXTBUS_APP_VERSION: ${{ secrets.NEXTBUS_APP_VERSION }}
          NEXTBUS_ESB_TOKEN: ${{ secrets.NEXTBUS_ESB_TOKEN }}
          NEXTBUS_USER_ID: ${{ secrets.NEXTBUS_USER_ID }}
          NEXTBUS_DEVICE_ID: ${{ secrets.NEXTBUS_DEVICE_ID }}
          NEXTBUS_DOMAIN: ${{ secrets.NEXTBUS_DOMAIN }}
          NEXTBUS_USER_AGENT: ${{ secrets.NEXTBUS_USER_AGENT }}
          NEXTBUS_IP_ADDR: ${{ secrets.NEXTBUS_IP_ADDR }}
          # Shared with the Vercel app so refreshed guest JWTs survive both.
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: python scripts/scrape.py

      - name: Commit and push any changes
        run: |
          git diff --exit-code || {
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            git add .
            git commit -m "gh-actions: update routes & stops"
            git push
          }
